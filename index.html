.do-section{background:#1a4a2e;padding:22px 18px;}

.help-section{padding:22px 18px;}
.s-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#f4821f;text-align:center;text-transform:uppercase;margin-bottom:5px;}

.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:600px;margin:0 auto;}

.hcb{display:inline-block;background:#f4821f;color:#fff;padding:6px 14px;border-radius:7px;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;border:none;cursor:pointer;}
.hcb:hover{background:#e0721a;}.hcb.g{background:#1a4a2e;}.hcb.g:hover{background:#2d6a3f;}

.chat-box{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;height:210px;box-shadow:0 2px 8px rgba(0,0,0,.06);}

.msg.bot{background:#e8f5e9;color:#1b5e20;align-self:flex-start;border-radius:3px 11px 11px 11px;}
.msg.user{background:#1a4a2e;color:#fff;align-self:flex-end;border-radius:11px 3px 11px 11px;}

.notif-row{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);}

/* INNER PAGES */
.inner{padding:18px 16px;}
.page-title{font-family:'Lora',serif;font-size:21px;text-align:center;color:#0f2d1c;margin-bottom:14px;}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}

.btn{display:block;width:100%;padding:11px;background:#f4821f;border:none;border-radius:9px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;color:#fff;cursor:pointer;transition:.15s;}

.btn-outline-orange{background:none;border:1.5px solid #f4821f;color:#f4821f;padding:6px 11px;border-radius:7px;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:.15s;}
.btn-outline-orange:hover{background:#fff3e0;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}

.row{background:#fff;border:1px solid #e8f0e8;border-radius:10px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:9px;}

.tabs{display:flex;background:#e8f0e8;border-radius:10px;padding:3px;margin-bottom:12px;}
.tab{flex:1;padding:7px;border:none;background:none;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;color:#555;border-radius:8px;cursor:pointer;transition:.15s;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:7px;}

</style>

<body>
<!-- ... (Your existing Modals for Reply and Task) ... -->

<div class="app" id="app">
  <nav class="nav" id="mainNav" style="display:none;">
    <div class="logo" onclick="goTo('Home')">🍲 MEALBRIDGE</div>
    <div class="nav-links" id="navLinks"></div>
  </nav>
  <div id="page"></div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
// (Your existing state variables: USER_PAGES, activeUser, users, etc.)
const USER_PAGES  = ['Home','Requests','Donate','Volunteer','Gallery','Blog','Schedule','Contact'];
const ADMIN_PAGES = ['Admin'];
let currentPage = 'login';   
let activeUser  = null;      
// ... (Keep all your DEMO_ACCOUNTS, notifications, foodRequests, users, donations arrays here)
// Make sure the `donations` array has your 10 preset records!

// ── HELPERS ────────────────────────────────────────────────────────────────
function isAdmin(){ return activeUser && activeUser.role === 'admin'; }
function sbadge(s){ const m={Pending:'b-orange',Approved:'b-blue',Delivered:'b-green',Rejected:'b-red','Pending Pickup':'b-orange',Confirmed:'b-green'};return`<span class="badge ${m[s]||'b-gray'}">${s}</span>`; }
// ... (Keep your other helper functions)

// ── ROUTING ───────────────────────────────────────────────────────────────
function renderPage(){
  const map = {
    login:    renderLogin,
    signup:   renderSignup,
    Home:     renderHome,
    // ... other pages
  };
  document.getElementById('page').innerHTML = (map[currentPage]||renderHome)();
  
  if(currentPage==='Home'){
    // THIS IS THE CRITICAL PART: Trigger the fetch when the home page loads
    loadLiveSupabaseDonations();
  }
}

// ── SUPABASE FETCH FUNCTION ───────────────────────────────────────────────
async function loadLiveSupabaseDonations() {
    const container = document.getElementById('live-donations');
    if(!container) return;
    
    // YOUR NEW SUPABASE CREDENTIALS
    const SUPABASE_URL = 'https://zylrxineiyklgdeqtuv.supabase.co/rest/v1/donations?select=*';
    const API_KEY = 'sb_publishable_p1ExCQhDygPfiFxJtAv4Q_mhwor_'; // Make sure you paste the FULL key
    
    const proxyUrl = 'https://api.allorigins.win/raw?url=';

    try {
        const response = await fetch(proxyUrl + encodeURIComponent(SUPABASE_URL), {
          headers: {
            'apikey': API_KEY,
            'Authorization': 'Bearer ' + API_KEY,
            'Content-Type': 'application/json'
          }
        });
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div style="color:#666;font-size:13px;">No live database donations found.</div>';
          return;
        }

        // Render the 10 donations into the grid
        container.innerHTML = data.map(d => `
            <div class="donation-card">
              <h3>${d.donor_name}</h3>
              <div class="amount">${d.item || 'R' + d.amount}</div>
              <span class="badge ${d.status === 'RECEIVED' || d.status === 'Approved' ? 'b-green' : 'b-orange'}">
                ${d.status}
              </span>
            </div>
        `).join('');

    } catch (error) {
        console.error(error);
        container.innerHTML = '<div style="color:red;font-size:12px;">Error loading live data.</div>';
    }
}

// ── HOME PAGE ─────────────────────────────────────────────────────────────
function renderHome(){
  // ... (Keep your hero, notifications, etc.)
  return`
  <div class="hero">...</div>
  <div class="impact">...</div>
  <div class="do-section">...</div>

  <!-- THIS IS THE NEW SECTION -->
  <div class="help-section" style="background:#fff;">
    <div class="s-lbl">LIVE DATABASE</div>
    <div class="s-ttl">Live Donations from Supabase</div>
    <!-- The loadLiveSupabaseDonations() function will fill this grid -->
    <div id="live-donations" class="grid-3" style="max-width:800px;margin:0 auto;">
      <div class="loading">Loading live data...</div>
    </div>
  </div>
  
  <div class="chat-section">...</div>`;
}

// ... (Keep the rest of your functions: renderLogin, renderDonate, etc.)

// ── BOOT ──────────────────────────────────────────────────────────────────
renderPage();
</script>
