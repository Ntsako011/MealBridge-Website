<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MealBridge | Feeding Pretoria</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Lora:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;}
.app{background:#f0f7f1;min-height:620px;border-radius:12px;overflow:hidden;color:#1a1a1a;}
.nav{background:#0f2d1c;display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:50px;position:sticky;top:0;z-index:200;}
.logo{font-size:16px;font-weight:900;color:#7dd98a;letter-spacing:1px;cursor:pointer;}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;align-items:center;}
.nav-btn{background:none;border:none;color:#c8e6c9;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:5px 8px;border-radius:6px;cursor:pointer;transition:.15s;}
.nav-btn:hover,.nav-btn.active{background:#2d6a3f;color:#fff;}
.nav-btn.locked{color:#666;cursor:not-allowed;}
.nav-btn.locked:hover{background:none;}
.notif-pip{display:inline-block;width:7px;height:7px;background:#f4821f;border-radius:50%;margin-left:3px;vertical-align:middle;}
.user-chip{display:flex;align-items:center;gap:6px;background:#2d6a3f;border-radius:20px;padding:4px 10px 4px 6px;margin-left:6px;}
.user-avatar{width:22px;height:22px;border-radius:50%;background:#7dd98a;color:#0f2d1c;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.user-chip span{font-size:11px;color:#c8e6c9;font-weight:700;}
.logout-btn{background:none;border:1px solid #4a7a5a;color:#81c784;font-family:'Nunito',sans-serif;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;cursor:pointer;margin-left:4px;}
.logout-btn:hover{background:#1a4a2e;}
.page{min-height:570px;}

/* LOGIN PAGE */
.login-page{min-height:620px;background:linear-gradient(135deg,#0f2d1c 0%,#1a4a2e 50%,#2d6a3f 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#fff;border-radius:20px;padding:32px 28px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{text-align:center;margin-bottom:20px;}
.login-logo-icon{font-size:48px;margin-bottom:8px;}
.login-logo h1{font-family:'Lora',serif;font-size:22px;color:#0f2d1c;}
.login-logo p{font-size:13px;color:#666;margin-top:3px;}
.role-toggle{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:20px;border-radius:12px;overflow:hidden;border:2px solid #e0e0e0;}
.role-btn{padding:14px 10px;border:none;background:#f5f5f5;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;text-align:center;color:#666;}
.role-btn .role-icon{font-size:22px;display:block;margin-bottom:4px;}
.role-btn .role-label{display:block;font-size:12px;}
.role-btn.active-user{background:#1a4a2e;color:#fff;}
.role-btn.active-admin{background:#f4821f;color:#fff;}
.role-indicator{text-align:center;font-size:12px;font-weight:700;padding:8px;border-radius:8px;margin-bottom:14px;}
.role-indicator.user-mode{background:#e8f5e9;color:#1a4a2e;}
.role-indicator.admin-mode{background:#fff3e0;color:#bf360c;}
.inp{width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid #e0e0e0;background:#fafafa;color:#1a1a1a;font-family:'Nunito',sans-serif;font-size:13px;margin-bottom:10px;transition:.15s;}
.inp:focus{outline:none;border-color:#2d6a3f;background:#fff;}
.inp::placeholder{color:#bbb;}
textarea.inp{resize:vertical;}select.inp{cursor:pointer;}
.btn-login{width:100%;padding:13px;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;color:#fff;cursor:pointer;transition:.15s;letter-spacing:.3px;margin-top:4px;}
.btn-login.user-btn{background:#1a4a2e;}.btn-login.user-btn:hover{background:#2d6a3f;}
.btn-login.admin-btn{background:#f4821f;}.btn-login.admin-btn:hover{background:#e0721a;}
.login-divider{text-align:center;color:#bbb;font-size:12px;margin:12px 0;position:relative;}
.login-divider::before,.login-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#e0e0e0;}
.login-divider::before{left:0;}.login-divider::after{right:0;}
.signup-link{text-align:center;font-size:12px;color:#666;margin-top:10px;}
.signup-link a{color:#1a4a2e;font-weight:700;cursor:pointer;text-decoration:underline;}

.err{color:#c62828;font-size:12px;margin-top:4px;text-align:center;}
.toast{display:none;text-align:center;padding:9px 14px;background:#c8e6c9;color:#1b5e20;border-radius:8px;margin-top:8px;font-weight:700;font-size:13px;}
.toast.show{display:block;}

/* SIGNUP PAGE */
.signup-page{min-height:620px;background:linear-gradient(135deg,#0f2d1c 0%,#1a4a2e 50%,#2d6a3f 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.signup-card{background:#fff;border-radius:20px;padding:28px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}

/* ACCESS DENIED */
.access-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:500px;text-align:center;padding:30px;}
.access-denied .lock-icon{font-size:64px;margin-bottom:16px;}
.access-denied h2{font-family:'Lora',serif;font-size:22px;color:#0f2d1c;margin-bottom:8px;}
.access-denied p{font-size:14px;color:#555;margin-bottom:20px;line-height:1.6;}

/* MAIN APP */
.hero{background:linear-gradient(135deg,#0f2d1c 0%,#1a4a2e 60%,#2d6a3f 100%);padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'🍲';position:absolute;font-size:160px;opacity:.06;top:-10px;right:-10px;line-height:1;}
.hero-tag{display:inline-block;background:rgba(125,217,138,.15);border:1px solid rgba(125,217,138,.3);color:#7dd98a;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 12px;border-radius:20px;margin-bottom:10px;}
.hero h1{font-family:'Lora',serif;font-size:26px;color:#fff;line-height:1.3;margin-bottom:8px;}
.hero h1 span{color:#7dd98a;}
.hero p{color:#a5d6a7;font-size:13px;line-height:1.7;max-width:460px;margin:0 auto 18px;}
.hero-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.btn-hp{background:#f4821f;color:#fff;border:none;padding:10px 20px;border-radius:9px;font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;cursor:pointer;transition:.15s;}
.btn-hp:hover{background:#e0721a;}
.btn-ho{background:none;color:#7dd98a;border:1.5px solid #7dd98a;padding:9px 20px;border-radius:9px;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;}
.btn-ho:hover{background:rgba(125,217,138,.1);}
.hero-stats{display:flex;justify-content:center;gap:24px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);flex-wrap:wrap;}
.hero-stat-n{font-size:20px;font-weight:900;color:#fff;}
.hero-stat-l{font-size:10px;color:#81c784;margin-top:1px;}
.impact{background:#f4821f;padding:12px 20px;text-align:center;}
.impact p{color:#fff;font-size:13px;font-weight:700;}
.impact a{color:#fff;cursor:pointer;text-decoration:underline;}
.do-section{background:#1a4a2e;padding:22px 18px;}
.do-section .s-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#7dd98a;text-align:center;text-transform:uppercase;margin-bottom:5px;}
.do-section .s-ttl{font-family:'Lora',serif;font-size:19px;color:#fff;text-align:center;margin-bottom:14px;}
.do-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;max-width:580px;margin:0 auto;}
.do-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 10px;text-align:center;}
.do-card-icon{font-size:26px;margin-bottom:6px;}
.do-card h4{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;}
.do-card p{font-size:11px;color:#a5d6a7;line-height:1.5;}
.help-section{padding:22px 18px;}
.s-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#f4821f;text-align:center;text-transform:uppercase;margin-bottom:5px;}
.s-ttl{font-family:'Lora',serif;font-size:19px;color:#0f2d1c;text-align:center;margin-bottom:14px;}
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:600px;margin:0 auto;}
.help-card{background:#fff;border-radius:14px;padding:16px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:.2s;border:2px solid transparent;}
.help-card:hover{border-color:#2d6a3f;transform:translateY(-2px);}
.help-card-icon{font-size:28px;margin-bottom:6px;}
.help-card h4{font-size:13px;font-weight:700;color:#1a4a2e;margin-bottom:3px;}
.help-card p{font-size:11px;color:#666;line-height:1.5;margin-bottom:9px;}
.hcb{display:inline-block;background:#f4821f;color:#fff;padding:6px 14px;border-radius:7px;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;border:none;cursor:pointer;}
.hcb:hover{background:#e0721a;}.hcb.g{background:#1a4a2e;}.hcb.g:hover{background:#2d6a3f;}
.chat-section{padding:18px;background:#f0f7f1;}
.chat-wrap{max-width:580px;margin:0 auto;}
.chat-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.chat-av{width:36px;height:36px;border-radius:50%;background:#1a4a2e;display:flex;align-items:center;justify-content:center;font-size:18px;}
.chat-hdr-t h4{font-size:13px;font-weight:700;color:#0f2d1c;}
.chat-hdr-t p{font-size:11px;color:#666;}
.chat-box{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;height:210px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:9px;}
.msg{max-width:82%;padding:8px 11px;border-radius:11px;font-size:13px;line-height:1.5;}
.msg.bot{background:#e8f5e9;color:#1b5e20;align-self:flex-start;border-radius:3px 11px 11px 11px;}
.msg.user{background:#1a4a2e;color:#fff;align-self:flex-end;border-radius:11px 3px 11px 11px;}
.msg.thinking{background:#f5f5f5;color:#888;font-style:italic;align-self:flex-start;}
.chat-row{display:flex;gap:7px;}
.chat-inp{flex:1;padding:8px 12px;border:1.5px solid #dce8dc;border-radius:18px;font-family:'Nunito',sans-serif;font-size:13px;}
.chat-inp:focus{outline:none;border-color:#2d6a3f;}
.chat-send{background:#1a4a2e;color:#fff;border:none;border-radius:18px;padding:8px 14px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
.chat-send:disabled{opacity:.4;cursor:not-allowed;}
.notif-strip{background:#0f2d1c;border-radius:12px;padding:8px 12px;max-height:150px;overflow-y:auto;margin-bottom:8px;}
.notif-row{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.notif-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}

/* INNER PAGES */
.inner{padding:18px 16px;}
.page-title{font-family:'Lora',serif;font-size:21px;text-align:center;color:#0f2d1c;margin-bottom:14px;}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.green-card{background:#1a4a2e;color:#fff;border-radius:12px;padding:14px;}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.btn{display:block;width:100%;padding:11px;background:#f4821f;border:none;border-radius:9px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;color:#fff;cursor:pointer;transition:.15s;}
.btn:hover{background:#e0721a;}.btn:active{transform:scale(.98);}.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-green{background:#1a4a2e;}.btn-green:hover{background:#2d6a3f;}
.btn-sm{width:auto;padding:6px 11px;font-size:11px;border-radius:7px;}
.btn-outline{background:none;border:1.5px solid #1a4a2e;color:#1a4a2e;padding:6px 11px;border-radius:7px;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:.15s;}
.btn-outline:hover{background:#e8f5e9;}
.btn-outline-red{background:none;border:1.5px solid #c62828;color:#c62828;padding:6px 11px;border-radius:7px;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:.15s;}
.btn-outline-red:hover{background:#ffebee;}
.btn-outline-orange{background:none;border:1.5px solid #f4821f;color:#f4821f;padding:6px 11px;border-radius:7px;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:.15s;}
.btn-outline-orange:hover{background:#fff3e0;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.b-green{background:#c8e6c9;color:#1b5e20;}.b-orange{background:#ffe0b2;color:#bf360c;}.b-blue{background:#bbdefb;color:#0d47a1;}.b-red{background:#ffcdd2;color:#b71c1c;}.b-gray{background:#eee;color:#555;}
.row{background:#fff;border:1px solid #e8f0e8;border-radius:10px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:9px;}
.row-actions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;}
.stat{background:#1a4a2e;border-radius:10px;padding:10px;text-align:center;}
.stat-n{font-size:19px;font-weight:900;color:#7dd98a;}.stat-l{font-size:10px;color:#a5d6a7;margin-top:1px;}
.tabs{display:flex;background:#e8f0e8;border-radius:10px;padding:3px;margin-bottom:12px;}
.tab{flex:1;padding:7px;border:none;background:none;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;color:#555;border-radius:8px;cursor:pointer;transition:.15s;}
.tab.active{background:#1a4a2e;color:#fff;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:7px;}
.cal-cell{padding:5px 2px;text-align:center;border-radius:5px;font-size:11px;}
.cal-cell.hdr{font-weight:700;color:#a5d6a7;font-size:10px;}
.cal-cell.event{background:#f4821f;color:#fff;font-weight:700;}
.cal-cell.today{outline:2px solid #7dd98a;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:340px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.modal h3{font-size:15px;font-weight:700;margin-bottom:11px;color:#0f2d1c;}
.modal-actions{display:flex;gap:8px;margin-top:11px;}
</style>
</head>
<body>
<div class="modal-bg" id="replyModal">
  <div class="modal">
    <h3>Reply to Message</h3>
    <div id="modalMsgText" style="background:#f0f7f1;border-radius:8px;padding:9px;font-size:12px;color:#333;margin-bottom:9px;"></div>
    <textarea class="inp" id="modalReplyText" rows="3" placeholder="Type your reply..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-green btn-sm" style="width:auto;flex:1;" onclick="sendModalReply()">SEND REPLY</button>
      <button class="btn btn-sm" style="width:auto;background:#eee;color:#333;" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="taskModal">
  <div class="modal">
    <h3>Assign Task</h3>
    <div id="taskModalName" style="font-weight:700;margin-bottom:9px;color:#1a4a2e;"></div>
    <select class="inp" id="taskSelect">
      <option value="">Choose a task...</option>
      <option>Food packing</option><option>Delivery driver</option><option>Kitchen prep</option>
      <option>Community outreach</option><option>Administration</option><option>Fundraising</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-green btn-sm" style="width:auto;flex:1;" onclick="confirmTaskAssign()">ASSIGN</button>
      <button class="btn btn-sm" style="width:auto;background:#eee;color:#333;" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="app" id="app">
  <nav class="nav" id="mainNav" style="display:none;">
    <div class="logo" onclick="goTo('Home')">🍲 MEALBRIDGE</div>
    <div class="nav-links" id="navLinks"></div>
  </nav>
  <div id="page"></div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
const USER_PAGES  = ['Home','Requests','Donate','Volunteer','Gallery','Blog','Schedule','Contact'];
const ADMIN_PAGES = ['Admin'];

let currentPage = 'login';   
let activeUser  = null;      

const DEMO_ACCOUNTS = [
  { email:'admin@mealbridge.org', password:'admin123', name:'Rose Ngubeni',  role:'admin' },
  { email:'user@mealbridge.org',  password:'user123',  name:'Bongani Dube',  role:'user'  },
];

let chatHistory = [];
let notifications = [
  {id:1,msg:'Food scheme this Saturday 9am — Pretoria North',date:'25 May 2026',read:false},
  {id:2,msg:'New volunteer opportunity — June 3rd',          date:'24 May 2026',read:false},
  {id:3,msg:'Donation of R100 received. Thank you!',         date:'20 May 2026',read:true}
];
let foodRequests = [
  {id:1,name:'Sarah Dlamini', people:4,details:'Family of 4, no income',     status:'Pending', date:'25 May 2026'},
  {id:2,name:'John Mokoena',  people:2,details:'Elderly couple, mobility issues',status:'Approved',date:'23 May 2026'},
  {id:3,name:'Thandi Zulu',   people:6,details:'Single mother, 5 children',  status:'Delivered',date:'20 May 2026'}
];
let users = [
  {id:1,name:'Rose Ngubeni', role:'admin',     joined:'Mar 2024',task:'Management',   email:'rose@mb.org'},
  {id:2,name:'Jack Collins', role:'volunteer', joined:'Jan 2025',task:'Food packing', email:'jack@mb.org'},
  {id:3,name:'Tim Mayabe',   role:'volunteer', joined:'Feb 2026',task:'Delivery driver',email:'tim@mb.org'}
];

// THESE ARE YOUR PRESET DONATIONS (Matching your Word Doc)
let donations = [
  {id:1,name:'Thabo', amount:'R500', type:'Money', date:'24 May 2026',status:'Confirmed'},
  {id:2,name:'Lerato', amount:'Mealie meal', type:'Goods', date:'22 May 2026',status:'Pending'},
  {id:3,name:'Sipho', amount:'R250', type:'Money', date:'20 May 2026',status:'Confirmed'}
];

let messages = [
  {id:1,from:'Bongani Sithole',email:'b@email.com',msg:'When is the next food collection?',date:'24 May 2026',replied:false,reply:''},
  {id:2,from:'Lerato Molefe',  email:'l@email.com',msg:'I want to donate 20kg rice.',      date:'23 May 2026',replied:true, reply:'Please bring to 245 Pretoria Street Mon–Fri 8am–4pm!'}
];
let posts = [
  {id:1,title:'Our biggest food drive yet!',    body:'Last Saturday we served over 400 meals. Thank you to every volunteer!',   date:'20 May 2026'},
  {id:2,title:'New kitchen facility open',       body:'Our upgraded kitchen is fully operational — three times the capacity!',     date:'10 May 2026'}
];
let events = [
  {id:1,date:'2026-05-31',label:'Monthly Food Drive — Pretoria North'},
  {id:2,date:'2026-06-07',label:'Volunteer Training Day'},
  {id:3,date:'2026-06-14',label:'Food Parcel Distribution'},
  {id:4,date:'2026-06-21',label:'Community Outreach Day'}
];
let gallery = [
  {label:'Community Meal',     img:'https://images.unsplash.com/photo-1593113598332-cd288d649433?w=600&q=80'},
  {label:'Food Distribution',  img:'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600&q=80'},
  {label:'Volunteer Day',      img:'https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?w=600&q=80'},
  {label:'Kitchen Prep',       img:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80'}
];
let uid = 30;
let replyTarget = null;
let taskTarget  = null;
let selectedAmt = 100;
let loginRole   = 'user'; 

// ── HELPERS ────────────────────────────────────────────────────────────────
function nid(){ return ++uid; }
function unread(){ return notifications.filter(n=>!n.read).length; }
function isAdmin(){ return activeUser && activeUser.role === 'admin'; }
function sbadge(s){ const m={Pending:'b-orange',Approved:'b-blue',Delivered:'b-green',Rejected:'b-red','Pending Pickup':'b-orange',Confirmed:'b-green'};return`<span class="badge ${m[s]||'b-gray'}">${s}</span>`; }
function showToast(id,msg){ const el=document.getElementById(id);if(!el)return;if(msg)el.textContent=msg;el.className='toast show';setTimeout(()=>el.classList.remove('show'),3200); }
function closeModal(){ document.querySelectorAll('.modal-bg').forEach(m=>m.classList.remove('open')); }
function notify(msg){ notifications.unshift({id:nid(),msg,date:'26 May 2026',read:false}); }

// ── NAV ───────────────────────────────────────────────────────────────────
function renderNav(){
  if(!activeUser){ document.getElementById('mainNav').style.display='none'; return; }
  document.getElementById('mainNav').style.display='flex';
  const pages = isAdmin() ? [...USER_PAGES,...ADMIN_PAGES] : USER_PAGES;
  const u = unread();
  document.getElementById('navLinks').innerHTML =
    pages.map(p=>`<button class="nav-btn${p===currentPage?' active':''}" onclick="goTo('${p}')">${p}${p==='Home'&&u?'<span class="notif-pip"></span>':''}</button>`).join('')
    + `<div class="user-chip"><div class="user-avatar">${activeUser.name[0]}</div><span>${activeUser.name} <span style="opacity:.7;">(${activeUser.role})</span></span></div>`
    + `<button class="logout-btn" onclick="doLogout()">Logout</button>`;
}

function goTo(p){
  if(p==='Admin' && !isAdmin()){
    currentPage='Home'; renderNav(); renderPage(); return;
  }
  currentPage=p; renderNav(); renderPage();
}

function doLogout(){
  activeUser=null; chatHistory=[];
  document.getElementById('mainNav').style.display='none';
  currentPage='login'; renderPage();
}

// ── ROUTING ───────────────────────────────────────────────────────────────
function renderPage(){
  const map = {
    login:    renderLogin,
    signup:   renderSignup,
    Home:     renderHome,
    Requests: renderRequests,
    Donate:   renderDonate,
    Volunteer:renderVolunteer,
    Gallery:  renderGallery,
    Blog:     renderBlog,
    Schedule: renderSchedule,
    Contact:  renderContact,
    Admin:    renderAdmin,
  };
  document.getElementById('page').innerHTML = (map[currentPage]||renderHome)();
  
  if(currentPage==='Home'){
    loadLiveSupabaseDonations(); // Load Supabase data immediately
    const inp=document.getElementById('chatIn');
    if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey) sendChat(); });
    const msgs=document.getElementById('chatMsgs');
    if(msgs) msgs.scrollTop=msgs.scrollHeight;
  }
}

// ── SUPABASE FETCH FUNCTION ───────────────────────────────────────────────
async function loadLiveSupabaseDonations() {
    const container = document.getElementById('live-donations');
    if(!container) return;
    
    // YOUR FULL SUPABASE CREDENTIALS
    const SUPABASE_URL = 'https://zylrxineiyklgdeqtuv.supabase.co/rest/v1/donations?select=*';
    const API_KEY = 'sb_publishable_p1ExCQhDygPfiFxJtAv4Q_mhwor_'; // Paste FULL key here!
    
    const proxyUrl = 'https://api.allorigins.win/raw?url=';

    try {
        const response = await fetch(proxyUrl + encodeURIComponent(SUPABASE_URL), {
          headers: {
            'apikey': API_KEY,
            'Authorization': 'Bearer ' + API_KEY,
            'Content-Type': 'application/json'
          }
        });
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div style="color:#666;font-size:13px;">No live database donations found.</div>';
          return;
        }

        // Render the 10 donations into the grid
        container.innerHTML = data.map(d => `
            <div class="donation-card">
              <h3>${d.donor_name}</h3>
              <div class="amount">${d.item || 'R' + d.amount}</div>
              <span class="badge ${d.status === 'RECEIVED' || d.status === 'Approved' ? 'b-green' : 'b-orange'}">
                ${d.status}
              </span>
            </div>
        `).join('');

    } catch (error) {
        console.error(error);
        container.innerHTML = '<div style="color:red;font-size:12px;">Error loading live data.</div>';
    }
}

// ── HOME PAGE ─────────────────────────────────────────────────────────────
function renderHome(){
  const notifRows = notifications.slice(0,4).map(n=>`
    <div class="notif-row">
      <div class="notif-dot" style="background:${n.read?'#4a6a4a':'#f4821f'};"></div>
      <div><div style="font-size:12px;color:#c8e6c9;">${n.msg}</div><div style="font-size:10px;color:#6a9a6a;margin-top:1px;">${n.date}</div></div>
    </div>`).join('');
  const chatMsgs = chatHistory.map(m=>`<div class="msg ${m.role==='user'?'user':'bot'}">${m.content.replace(/\n/g,'<br>')}</div>`).join('');
  
  // Preset Donations HTML (Thabo, Lerato, Sipho)
  const presetDonationsHTML = donations.map(d=>`
    <div style="background:#f9fbf9;border-left:4px solid #2e7d32;padding:12px;border-radius:8px;margin-bottom:10px;">
      <div style="font-weight:700;color:#2e7d32;">${d.name}</div>
      <div style="font-size:13px;color:#333;">${d.amount}</div>
      <div style="margin-top:6px;"><span class="badge ${d.status==='Confirmed'?'b-green':'b-orange'}">${d.status}</span></div>
    </div>`).join('');

  return`
  <div class="hero">
    <div class="hero-tag">📍 PRETORIA, SOUTH AFRICA</div>
    <h1>Fighting hunger,<br>one meal at a <span>time.</span></h1>
    <p>MealBridge is a non-profit food scheme dedicated to feeding hungry and vulnerable families across Pretoria. Hot meals, food parcels, and community support — every single day.</p>
    <div class="hero-btns">
      <button class="btn-hp" onclick="goTo('Donate')">💚 Donate Now</button>
      <button class="btn-ho" onclick="goTo('Requests')">🍽️ Request Food</button>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><div class="hero-stat-n">847+</div><div class="hero-stat-l">Meals Served</div></div>
      <div class="hero-stat"><div class="hero-stat-n">${users.filter(u=>u.role==='volunteer').length}+</div><div class="hero-stat-l">Volunteers</div></div>
      <div class="hero-stat"><div class="hero-stat-n">${foodRequests.length}+</div><div class="hero-stat-l">Families Helped</div></div>
    </div>
  </div>

  ${isAdmin() 
    ? `<div class="impact"><p>🔔 <b>${foodRequests.filter(r=>r.status==='Pending').length}</b> food requests awaiting approval — <a onclick="goTo('Admin')">Review in Admin</a></p></div>`
    : `<div class="impact"><p>🔥 Every rand counts. <a onclick="goTo('Donate')">Donate today</a> and help us serve more families.</p></div>`}

  <!-- PRESET DONATIONS (From Word Doc) -->
  <div class="help-section" style="background:#fff;">
    <div class="s-lbl">OUR IMPACT</div>
    <div class="s-ttl">Preset Recent Donations</div>
    <div style="max-width:500px;margin:0 auto;">
      ${presetDonationsHTML}
    </div>
  </div>

  <!-- LIVE SUPABASE DONATIONS -->
  <div class="help-section">
    <div class="s-lbl">LIVE DATABASE</div>
    <div class="s-ttl">Live Donations from Supabase</div>
    <div id="live-donations" class="grid-3" style="max-width:800px;margin:0 auto;">
      <div class="loading">Loading live data...</div>
    </div>
  </div>

  <div class="chat-section">
    <div class="chat-wrap">
      <div class="g2" style="gap:14px;">
        <div>
          <div class="chat-hdr"><div class="chat-av">🤖</div><div class="chat-hdr-t"><h4>MealBridge Assistant</h4><p>AI-powered · Ask anything</p></div></div>
          <div class="chat-box">
            <div class="chat-msgs" id="chatMsgs">${!chatHistory.length?'<div class="msg bot">Hi '+activeUser.name.split(' ')[0]+'! 👋 Ask me about food requests, donations, or volunteering.</div>':''}${chatMsgs}</div>
            <div class="chat-row"><input class="chat-inp" id="chatIn" placeholder="Ask anything..."/><button class="chat-send" id="chatBtn" onclick="sendChat()">Send</button></div>
          </div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;color:#555;letter-spacing:.5px;margin-bottom:6px;">NOTIFICATIONS</div>
          <div class="notif-strip">${notifRows}</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── OTHER PAGES (REQUESTS, DONATE, VOLUNTEER, etc.) ───────────────────────
function renderRequests(){ return `<div class="inner"><h1 class="page-title">Food Requests</h1></div>`; }

function renderDonate(){ 
  return`
  <div class="inner"><h1 class="page-title">Donate</h1>

    <div class="tabs" id="donateTabs">
      <button class="tab active" onclick="swTab('donateTabs','donateContent',0)">💵 Money</button>
      <button class="tab" onclick="swTab('donateTabs','donateContent',1)">📦 Goods</button>
      <button class="tab" onclick="swTab('donateTabs','donateContent',2)">📋 History</button>
    </div>
    <div id="donateContent">
      <div id="dtab0">
        <div class="g3" style="margin-bottom:12px;">
          <div class="card" style="text-align:center;"><div style="font-weight:700;color:#1a4a2e;font-size:13px;">ABSA Bank</div><div style="font-size:12px;color:#555;margin-top:4px;">Acc: 1234567<br>Ref: DONATE</div></div>
          <div class="card" style="text-align:center;"><div style="font-weight:700;color:#1a4a2e;font-size:13px;">PayPal</div><div style="font-size:12px;color:#555;margin-top:4px;">mealbridge@info.org</div></div>
          <div class="card" style="text-align:center;"><div style="font-weight:700;color:#1a4a2e;font-size:13px;">FNB EFT</div><div style="font-size:12px;color:#555;margin-top:4px;">Acc: 9876543<br>Branch: 250655</div></div>
        </div>
        <div class="card">
          <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Quick Donate</div>
          <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
            ${[50,100,250,500].map(a=>`<button onclick="pickAmt(${a},this)" style="flex:1;min-width:50px;padding:8px;border:1.5px solid #1a4a2e;border-radius:7px;background:${a===selectedAmt?'#1a4a2e':'none'};color:${a===selectedAmt?'#fff':'#1a4a2e'};font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;" id="ab${a}">R${a}</button>`).join('')}
          </div>
          <input class="inp" id="customAmt" placeholder="Custom amount (R)" type="number" min="1"/>
          <input class="inp" id="donorName" placeholder="Your name (optional)" value="${activeUser?.name||''}"/>
          <button class="btn" onclick="submitMoney()">DONATE NOW 💚</button>
          <div class="toast" id="dToast">Thank you! Donation recorded. 🌟</div>
        </div>
      </div>
      <div id="dtab1" style="display:none;">
        <div class="card">
          <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Goods Donation</div>
          <input class="inp" id="gName" placeholder="Your Full Name" value="${activeUser?.name||''}"/>
          <input class="inp" id="gPhone" placeholder="Phone Number"/>
          <input class="inp" id="gGoods" placeholder="What are you donating? (e.g. 20kg rice)"/>
          <input class="inp" id="gAddress" placeholder="Your address (we can arrange pickup)"/>
          <div style="background:#f0f7f1;border-radius:9px;padding:10px;margin-bottom:9px;"><div style="font-size:12px;color:#555;margin-bottom:5px;">Upload proof of goods:</div><input type="file" id="gProof" accept="image/*,.pdf" style="font-size:12px;width:100%;"/></div>
          <button class="btn" onclick="submitGoods()">SUBMIT GOODS DONATION</button>
          <div class="toast" id="gToast">Thank you! Admin will contact you. 📦</div>
          <div class="err" id="gErr"></div>
        </div>
      </div>
      <div id="dtab2" style="display:none;"><div style="font-size:11px;font-weight:700;color:#555;letter-spacing:.5px;margin-bottom:8px;">DONATION HISTORY</div>${donations.map(d=>`<div class="row"><div><div style="font-weight:700;font-size:13px;">${d.name} — ${d.type}</div><div style="font-size:12px;color:#555;">${d.amount} · ${d.date}</div></div>${sbadge(d.status)}</div>`).join('')}</div>
    </div>
  </div></div>`;
}

function renderVolunteer(){ return `<div class="inner"><h1 class="page-title">Volunteer</h1></div>`; }
function renderGallery(){ return `<div class="inner"><h1 class="page-title">Gallery</h1></div>`; }
function renderBlog(){ return `<div class="inner"><h1 class="page-title">Blog</h1></div>`; }
function renderSchedule(){ return `<div class="inner"><h1 class="page-title">Schedule</h1></div>`; }
function renderContact(){ return `<div class="inner"><h1 class="page-title">Contact</h1></div>`; }
function renderAdmin(){ return `<div class="inner"><h1 class="page-title">Admin</h1></div>`; }

// ── HELPERS ────────────────────────────────────────────────────────────────
function pickAmt(a,btn){ selectedAmt=a;document.querySelectorAll('[id^="ab"]').forEach(b=>{b.style.background='none';b.style.color='#1a4a2e';});btn.style.background='#1a4a2e';btn.style.color='#fff'; }
function submitMoney(){ const custom=document.getElementById('customAmt').value;const name=document.getElementById('donorName').value.trim()||'Anon';const amt='R'+(custom||selectedAmt);donations.unshift({id:nid(),name,type:'Money',amount:amt,date:'26 May 2026',status:'Confirmed'});notify(`Donation of ${amt} from ${name}`);showToast('dToast'); }
function submitGoods(){ const name=document.getElementById('gName').value.trim();const goods=document.getElementById('gGoods').value.trim();if(!name||!goods){document.getElementById('gErr').textContent='Please fill in name and goods.';return;}document.getElementById('gErr').textContent='';donations.unshift({id:nid(),name,type:'Goods',amount:goods,date:'26 May 2026',status:'Pending Pickup'});notify(`Goods donation from ${name}: ${goods}`);showToast('gToast'); }
function swTab(barId,contentId,idx){ document.getElementById(barId).querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx)); const pfx=contentId==='donateContent'?'dtab':contentId==='adminContent'?'atab':'ltab'; document.getElementById(contentId).querySelectorAll('[id^="'+pfx+'"]').forEach((el,i)=>el.style.display=i===idx?'block':'none'); }

// ── BOOT ──────────────────────────────────────────────────────────────────
renderPage();
</script>
